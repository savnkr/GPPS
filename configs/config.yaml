heat_equation:
  pde:
    alpha: 0.01
    L_x: 1.0
    L_t: 1.0

  kernel:
    lengthscale: [0.6, 0.6]
    variance: 0.02

  training:
    n_initial: 20
    n_final: 60
    n_iterations: 8
    n_test_grid: 20
    n_pool: 1000
    jitter: 1.0e-6

  active_learning:
    acquisition_function: variance
    kappa: 2.0
    exclusion_radius: 0.05
    ar_ratio: 0.3

  sdd:
    batch_size: 20
    beta: auto
    rho: 0.9
    epochs_mean: 2000
    epochs_var: 1000

  output:
    save_results: true
    results_dir: results/heat_equation


poisson_2d:
  kernel:
    lengthscale: [2.5, 2.5]
    variance: 0.25

  training:
    n_initial: 10
    n_final: 80
    n_iterations: 10
    n_test: 600
    n_boundary: 30
    n_pool: 2000
    jitter: 1.0e-6

  active_learning:
    acquisition_function: variance
    kappa: 2.0
    exclusion_radius: 0.05
    ar_ratio: 0.3
    use_clustering: true

  sdd:
    batch_size: 20
    beta: auto
    rho: 0.9
    epochs_mean: 2000
    epochs_var: 1000

  output:
    save_results: true
    results_dir: results/poisson_2d


poisson_3d:
  kernel:
    lengthscale: [0.531, 0.531, 0.531]
    variance: 0.678

  training:
    n_interior_per_side: 6
    n_boundary_per_side: 8
    n_initial: 20
    n_final: 80
    n_iterations: 10
    n_test: 500
    n_pool: 2000
    jitter: 1.0e-3

  active_learning:
    acquisition_function: variance
    kappa: 2.0
    exclusion_radius: 0.05
    ar_ratio: 0.3
    use_clustering: true
    na_per_iter: 5

  sdd:
    batch_size: 50
    beta: auto
    rho: 0.9
    epochs_mean: 2000
    epochs_var: 1000

  output:
    save_results: true
    results_dir: results/poisson_3d
